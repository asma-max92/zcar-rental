services:
  postgres:
    image: postgres:15-alpine
    container_name: zcar-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: zcar_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d zcar_test"]
      interval: 5s
      timeout: 5s
      retries: 5
